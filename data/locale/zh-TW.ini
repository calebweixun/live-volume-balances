LiveVolumeBalancer="即時音量平衡器"
TargetLoudness="滾動目標響度"
TargetLoudnessHelp="自動增益會追近此 400 毫秒滾動估算；面板也顯示 3 秒讀值。範圍：−36 至 0 LUFS。這是響度目標，不是輸出上限；最大向上補償或峰值保護上限可能使輸出低於目標。"
PeakCeiling="4 倍 FIR 峰值保護上限"
PeakCeilingHelp="獨立的輸出安全上限，用來限制估算的取樣間峰值。範圍：−24 至 0 dBTP 估算值。"
Bypass="旁通"
BypassHelp="關閉自動增益與峰值保護，但保留固定輸出延遲。"
Advanced="進階設定"
MaximumCompensation="最大向上補償"
MaximumCompensationHelp="限制有活動的安靜音訊最多可提高多少。範圍：0 至 36 dB。"
MaximumReduction="最大向下衰減"
MaximumReductionHelp="限制輸入高於目標時最多可降低多少增益。範圍：0 至 36 dB。"
ActivityFloor="活動底線（環境噪音門）"
ActivityFloorHelp="依跨聲道 RMS 與相對活動門偵測；訊號需高於底線 6 dB 才會開門，只有高於底線 3 dB 的電平會更新相對參考。門檻附近的環境聲不會重設 1.2 秒保留時間。停頓時噪音重新開門可提高此值；小聲語音無法開門則可降低。範圍：−100 至 −6 dBFS。"
FaderSmoothness="推桿反應／平順度"
FaderSmoothnessHelp="這是單一的增益推桿反應控制：0 反應快，100 移動平順。設定 85 時，推桿的最大變化速率約為每秒向下 3.8 dB、向上 4.5 dB；光看速率，12 dB 至少要約 3.1 秒向下或 2.7 秒向上，偵測平滑可能讓實際時間更久。它會持續混合 85% 的 3 秒響度讀值與 400 毫秒讀值。字句間約 1.2 秒會保持當下推桿位置；即使短句結束時增益還在移動，也不會繼續拉高底噪。較長停頓後，同一條推桿才會往安靜時衰減設定移動；活動恢復時，則平順回到滾動響度目標。持續的小聲活動 0.8 秒後，恢復輔助可能暫時提高 400 毫秒讀值比重。峰值保護另以近期輸入峰值引導慢速推桿，快速 FIR 保護則處理突發峰值。它處理整體混音，不會分離人聲與音樂。舊版已保存的衰減反應／增益恢復值升級後不再使用。"
QuietAttenuation="安靜時衰減"
QuietAttenuationHelp="這是同一條推桿在安靜時的終點，約 1.2 秒沒有活動後才會移動。例如設定 3 dB，長停頓時的推桿目標為 −3 dB；語音回來後會平順回到滾動目標。設為 0 dB 表示 unity。範圍：0 至 12 dB。音樂或語音仍活動時，此功能不會消除背景噪音。"
