LiveVolumeBalancer="即時音量平衡器"
TargetLoudness="滾動目標響度"
TargetLoudnessHelp="自動增益會追近此 400 毫秒滾動估算；面板也顯示 3 秒讀值。範圍：−36 至 0 LUFS。這是響度目標，不是輸出上限；最大向上補償或峰值保護上限可能使輸出低於目標。"
