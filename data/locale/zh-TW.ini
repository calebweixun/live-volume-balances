InfoTooltip="自動音量平衡的運作方式"
InfoTitle="自動音量平衡說明"
InfoText="此濾鏡會自動調整一條混音總訊號，使其接近所選的滾動目標響度。輸入快速 RMS 軌使用 dBFS 刻度並標示設定的絕對活動底線。輸出區分開顯示快速 dBFS 與 400 毫秒 K 加權 LUFS 軌，因此不會把響度目標畫在 dBFS 刻度上。數字也保留輸入 400 毫秒與輸入／輸出 3 秒估算；這些是滾動估算，不是整段節目的整合 LUFS 正規化。\n\n增益條使用固定 −36 至 +36 dB 刻度，中線為 0 dB；目前實際增益從中線向左右填色，標記線與兩端文字表示最大衰減與補償。大字顯示正負增益，↓ 衰減反應與 ↑ 增益恢復顯示目前平滑設定。4 倍 FIR 峰值保護會在需要時進一步降低增益，以遵守獨立設定的峰值上限。\n\n濾鏡入口到出口固定延遲 6 個取樣：48 kHz 時 0.125 毫秒，44.1 kHz 時約 0.136 毫秒。此數值不含音訊介面、OBS 其他緩衝或處理、編碼、串流與觀眾播放延遲。活動底線只是相對活動門的一部分；訊號高過絕對底線仍不保證增益一定開啟。峰值估算尚未通過完整 BS.1770 符合性測試。"
