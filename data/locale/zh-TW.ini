InfoTitle="自動音量平衡說明"
InfoText="此濾鏡會自動調整一條混音總訊號，使其接近所選的滾動目標響度。它使用 K 加權的 400 毫秒偵測器與 3 秒滾動音量表，因此讀值是估算值，不是整段節目的整合 LUFS 正規化。\n\n目標值控制平均響度；4 倍 FIR 峰值保護上限則是獨立的輸出安全限制，瞬間峰值接近上限時會再降低增益。它固定增加 6 個取樣延遲（48 kHz 約 0.13 毫秒）。活動底線使用逐聲道 RMS 與相對門檻，避免停頓時拉高環境噪音；若小聲講道無法開門，或環境聲被抬高，請調整底線。\n\n增益變化經過平滑處理以保留音樂動態。若最大補償或峰值上限已達限制，差異很大的輸入不一定都能到達相同目標。峰值估算尚未通過完整 BS.1770 符合性測試。"
