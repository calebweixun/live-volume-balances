InfoTooltip="自動音量平衡的運作方式"
InfoTitle="自動音量平衡說明"
InfoText="此濾鏡會自動調整一條混音總訊號，使其接近所選的滾動目標響度。IN／OUT 快速音量表顯示跨聲道 RMS，使用 30 毫秒起音與 150 毫秒衰減。響度數字使用獨立的 K 加權 400 毫秒與 3 秒滾動視窗；這些是估算值，不是整段節目的整合 LUFS 正規化。\n\n目標值控制平均響度；4 倍 FIR 峰值保護上限則是獨立的輸出安全限制，瞬間峰值接近上限時會再降低增益。此濾鏡入口到出口固定延遲 6 個取樣：48 kHz 時 0.125 毫秒，44.1 kHz 時約 0.136 毫秒。此數值不含音訊介面、OBS 其他緩衝或處理、編碼、串流與觀眾播放延遲。\n\n活動底線使用跨聲道 RMS 與相對門檻，避免停頓時拉高環境噪音。增益變化經過平滑處理以保留音樂動態。若最大補償或峰值上限已達限制，差異很大的輸入不一定都能到達相同目標。峰值估算尚未通過完整 BS.1770 符合性測試。"
