TargetLufsRailHelp="輸出 400 毫秒 K 加權響度使用獨立的 −60 至 0 LUFS 刻度。標記表示滾動響度目標，不是峰值上限。"
TargetLufsReadoutFormat="目標 %1"
GainBarHelp="正負增益使用固定 −36 至 +36 dB 刻度，中線是 0 dB。標記線與兩端文字顯示最大衰減與補償設定；峰值保護需要時可再降低增益。"
GainAdvancedSettingsTooltipFormat="推桿平順度：%1/100 · 安靜時衰減：%2 dB"
GainAttackTagTooltip="衰減反應設定：輸入響度升高、增益降低時使用的平滑時間。"
GainRecoveryTagTooltip="增益恢復設定：輸入響度降低、增益提高時使用的平滑時間。"
PeakMeterHelp="4 倍 FIR 估算取樣間峰值保持與設定的輸出保護上限。此估算尚未通過完整 BS.1770 符合性測試。"
MeterRangeHelp="各軌的刻度範圍會顯示在說明提示中；刻度線將 dB 範圍分成四等分。"
OpenFilterSettings="開啟此濾鏡設定"
