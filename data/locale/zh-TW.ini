ActivityPaused="停頓"
RollingReadingsHelp="此濾鏡入口／出口的 K 加權滾動響度估算：400 毫秒瞬時值與 3 秒短期值，不是整段節目的整合 LUFS。讀值不含 OBS 混音器的來源音量推桿。"
FastMeterHelp="此濾鏡入口／出口的快速跨聲道 RMS 電平表，使用 −60 至 0 dBFS 刻度、30 毫秒起音與 150 毫秒衰減。讀值不含 OBS 混音器的來源音量推桿。"
InputActivityMarkerHelp="輸入快速 RMS 使用 −100 至 0 dBFS 刻度。標記表示設定的絕對活動底線；相對活動門也可能讓增益維持關閉。"
InputActivityFloorReadoutFormat="底線 %1"
TargetLufsRailHelp="此濾鏡出口的 400 毫秒 K 加權響度使用獨立的 −60 至 0 LUFS 刻度。標記表示滾動目標，不是峰值上限。OBS 混音器的來源音量推桿位於濾鏡之後，不會反映在此讀值。"
TargetLufsReadoutFormat="目標 %1"
TargetLufsLimitedReadoutFormat="目標 %1 · 受限"
TargetLufsPeakLimitedReadoutFormat="目標 %1 · 峰值"
TargetLufsBoostLimitedReadoutFormat="目標 %1 · 補償"
TargetLufsPeakLimitedHelp="峰值感知推桿或快速 4 倍 FIR 保護已碰到可用峰值空間上限，滾動輸出仍低於目標。提高平均響度會超過設定的峰值上限。OBS 混音器的來源音量推桿位於濾鏡之後，不會反映在此讀值。"
TargetLufsBoostLimitedHelp="主推桿已接近「最大補償」上限，滾動輸出仍低於目標。提高最大補償也可能放大活動期間的底噪。OBS 混音器的來源音量推桿位於濾鏡之後，不會反映在此讀值。"
TargetLufsBothLimitedHelp="峰值上限與最大補償都正在限制增益，滾動輸出仍低於目標。OBS 混音器的來源音量推桿位於濾鏡之後，不會反映在此讀值。"
GainBarHelp="此濾鏡實際套用的正負增益，使用固定 −36 至 +36 dB 刻度，中線為 0 dB。它包含快速峰值保護，但不含位於濾鏡之後的 OBS 混音器來源音量推桿。標記線與兩端文字顯示最大衰減與補償設定。"
GainAdvancedSettingsTooltipFormat="推桿平順度：%1/100 · 活動恢復：%2/100 · 突增反應：%3/100 · 安靜終點：−%4 dB"
FaderSmoothnessTagTooltip="此來源的推桿反應設定：0 反應快，100 移動平順。"
ActivityReentrySpeed="活動恢復速度"
ActivityReentrySpeedHelp="活動門曾開啟並完全關閉後，新訊號需連續約 40 毫秒高於開啟門檻。確認後，活動門保持開啟期間（包含保留時間）最多 2 秒偏向 400 毫秒讀值並加快向上推桿。啟動時不會加速，也不會略過活動門、最大補償或峰值上限；此功能不判斷人聲或音樂。"
LoudnessJumpResponse="持續響度突增反應"
LoudnessJumpResponseHelp="0 表示關閉；預設 75。當 400 毫秒響度讀值持續約 250 毫秒高於 3 秒讀值至少 6 LU，且目前快速 RMS 持續高於近期 3 秒 RMS 參考至少 3 dB，推桿會暫時改追 400 毫秒讀值並加快向下調整。反應至少維持 1 秒，差距低於 4 LU 才會解除；dB 推桿仍受速率限制，獨立 FIR 峰值保護仍生效。這是持續電平變化偵測，不是人聲／音樂分類，無法分離混合訊號，也不增加音訊延遲。"
PeakMeterHelp="4 倍 FIR 估算取樣間峰值保持與設定的輸出保護上限。此估算尚未通過完整 BS.1770 符合性測試。"
MeterRangeHelp="各軌的刻度範圍會顯示在說明提示中；刻度線將 dB 範圍分成四等分。"
OpenFilterSettings="開啟此濾鏡設定"
MonitorLatencyFormat="濾鏡延遲 · 輸入 0.000 毫秒 · 輸出 +%1 毫秒 · %2 個取樣"
MonitorLatencyUnavailable="濾鏡延遲 · 輸入 — · 輸出 —"
MonitorLatencyHelp="只計算此濾鏡入口到出口的延遲；濾鏡增加 6 個取樣。不含位於濾鏡之後的 OBS 混音器來源音量推桿、音訊介面、OBS 其他緩衝或處理、編碼、串流與觀眾播放延遲。"
FilterStageInfo="輸入／輸出讀值與實際增益都在此濾鏡入口與出口測量。OBS 會在濾鏡之後套用來源的混音器音量推桿，因此推桿可以改變實際聽到或串流出去的音量，但不會改變此面板的濾鏡讀值。"
InfoTooltip="自動音量平衡的運作方式"
InfoTitle="自動音量平衡說明"
InfoText="此濾鏡會自動調整一條混音總訊號，使其接近所選的滾動目標響度。輸入快速 RMS 軌使用 dBFS 刻度並標示設定的絕對活動底線。輸出區分開顯示快速 dBFS 與 400 毫秒 K 加權 LUFS 軌，因此不會把響度目標畫在 dBFS 刻度上。數字也保留輸入 400 毫秒與輸入／輸出 3 秒估算；這些是滾動估算，不是整段節目的整合 LUFS 正規化。\n\n增益條使用固定 −36 至 +36 dB 刻度，中線為 0 dB；目前實際增益從中線向左右填色，標記線與兩端文字表示最大衰減與補償。推桿標籤顯示此來源的平順度；將游標停在增益條上可查看平順度、活動恢復速度、持續響度突增反應與安靜時終點。平順度 0 反應快，100 移動平順。預設 85 會持續混合 85% 的 3 秒響度讀值與 400 毫秒讀值，並將推桿最大變化限制在每秒向下約 3.8 dB、向上約 4.5 dB。光看速率，12 dB 至少要約 3.1 秒向下或 2.7 秒向上；偵測平滑可能讓實際時間更久。獨立的「活動恢復速度」只在活動門曾開啟並完全關閉，且新訊號連續約 40 毫秒高於開啟門檻時生效；接著在活動門保持開啟期間最多 2 秒偏向 400 毫秒讀值並加快向上恢復。它不會加速初次啟動，也不會改變一般推桿移動或略過活動門、最大補償與峰值上限。「持續響度突增反應」會在 400 毫秒讀值持續約 250 毫秒高於 3 秒讀值至少 6 LU，且目前快速 RMS 高於近期 3 秒 RMS 參考至少 3 dB 時觸發。預設 75 會暫時追 400 毫秒讀值並縮短目標平滑，讓主推桿較快向下移動；推桿仍受速率限制，反應至少維持 1 秒，FIR 峰值保護仍生效。它偵測電平變化，不判斷人聲或音樂。字句間約 1.2 秒保持當下推桿位置；較長停頓後，推桿才會移向安靜時終點（例如 −3 dB），活動恢復時再回到滾動目標。\n\n「補償」標記表示主推桿已接近「最大補償」上限，而滾動輸出仍低於目標；「峰值」表示峰值感知推桿或快速保護已碰到可用峰值空間上限。任一限制都可能讓輸出低於目標。例如輸入 −33.9 LUFS、最大補償 +12 dB 時，輸出最多約 −21.9 LUFS，峰值空間可能還會再降低，不會達到 −14 LUFS。\n\n這是單一總訊號的音量推桿，不是人聲分離器或降噪器。若音樂、人聲與背景噪音同時存在，它們會共用相同增益；濾鏡無法只提高人聲，也無法在音樂或語音活動時移除底噪。近期輸入峰值會引導主推桿接手持續的峰值上限工作；獨立的快速 4 倍 FIR 保護仍會處理突發峰值。峰值讀值是估算，尚非通過 BS.1770 完整符合性測試的結果。\n\n濾鏡入口到出口固定延遲 6 個取樣：48 kHz 時 0.125 毫秒，44.1 kHz 時約 0.136 毫秒。此數值不含音訊介面、OBS 其他緩衝或處理、編碼、串流與觀眾播放延遲。活動底線只是相對活動門的一部分；訊號高過絕對底線仍不保證增益一定開啟。"
