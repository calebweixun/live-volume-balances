MaximumReductionHelp="限制輸入高於目標時最多可降低多少增益。範圍：0 至 36 dB。"
ActivityFloor="活動底線（環境噪音門）"
ActivityFloorHelp="依跨聲道 RMS 偵測活動。停頓時環境聲被抬高可提高此值；小聲語音無法開門則可降低。範圍：−100 至 −6 dBFS。"
GainAttack="衰減反應時間"
GainAttackHelp="輸入電平升高時，增益降低的速度。範圍：10 至 3000 毫秒。"
GainRecovery="增益恢復時間"
GainRecoveryHelp="輸入電平降低時，增益恢復的速度。範圍：50 至 10000 毫秒。"
FaderSmoothness="推桿過渡平順度"
FaderSmoothnessHelp="調整增益推桿的過渡曲線：0 只使用 400 毫秒偵測器與既有衰減／恢復設定；100 對短暫電平變化保持更多增益。設定 85 時，大幅變化限制約為每秒向下 11 dB、向上 5.3 dB，並使用緩入加速度。單看最大速率，12 dB 變化向下／向上至少約需 1.1／2.4 秒；偵測視窗、約 433 毫秒的增益目標持續平滑，以及衰減反應／恢復設定都可能讓實際轉換更久。它會持續混合約 76.5% 的 3 秒讀值與 400 毫秒讀值，讓短句較少推動主要增益。若活動音訊連續 0.8 秒比 3 秒讀值低超過 8 LU，推桿會暫時偏向 400 毫秒讀值並加快增益恢復；活動門必須保持開啟，關閉的停頓不會觸發此輔助。持續的新電平仍會在數秒內調整。降低增益比恢復快。這是整體混音的推桿曲線，不會分離人聲與音樂。"
QuietAttenuation="安靜時衰減"
QuietAttenuationHelp="活動門關閉後，平順地將整條混音降低設定值；活動恢復時再淡回。設為 0 dB 可關閉。範圍：0 至 12 dB。若音樂或人聲使活動門保持開啟，此功能不會消除背景噪音。"
