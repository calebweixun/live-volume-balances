LiveVolumeBalancer="Live Volume Balancer"
TargetLoudness="Target rolling loudness"
TargetLoudnessHelp="Rides average loudness toward this 400 ms rolling estimate; the dock also shows a 3 s reading. Range: −36 to 0 LUFS. This is a goal, not an output ceiling; maximum upward compensation or the peak guard ceiling can keep the output below the target."
PeakCeiling="4x FIR peak guard ceiling"
PeakCeilingHelp="Separate output safety limit for estimated intersample peaks. Range: −24 to 0 dBTP est."
Bypass="Bypass"
BypassHelp="Disables gain riding and peak protection while keeping the fixed output delay."
Advanced="Advanced settings"
MaximumCompensation="Maximum upward compensation"
MaximumCompensationHelp="Caps how much active quiet audio can be raised. Range: 0 to 36 dB."
MaximumReduction="Maximum downward reduction"
MaximumReductionHelp="Caps gain reduction when the input is louder than the target. Range: 0 to 36 dB."
ActivityFloor="Activity floor (room-noise gate)"
ActivityFloorHelp="Uses channel-linked RMS and a relative gate. A signal must reach 6 dB above this floor to open; only levels more than 3 dB above the floor move the relative reference. Borderline room noise cannot restart the 1.2 s hold. Raise the floor if noise reopens the rider; lower it if quiet speech does not open the gate. Range: −100 to −6 dBFS."
FaderSmoothness="Fader response / smoothness"
FaderSmoothnessHelp="The single gain-rider response control: 0 moves quickly; 100 moves smoothly. At 85, the dB fader's maximum slew is about 3.8 dB/s down and 4.5 dB/s up; a 12 dB move therefore takes at least about 3.1 s down or 2.7 s up from slew alone, and detector smoothing can make it longer. It continuously blends 85% of the 3 s reading with the 400 ms reading. Between words, it holds the actual fader position for about 1.2 s; a brief phrase will not keep raising room noise while the fader is still moving. A longer pause then moves the same fader toward the quiet-period attenuation setting. When activity resumes, it moves smoothly back toward the rolling target. A sustained-quiet recovery assist can temporarily favor the 400 ms reading after 0.8 s of active low-level audio. Peak protection remains separate: a recent input-peak envelope guides the slow fader, while the fast FIR guard catches sudden peaks. This responds to the mixed program level, not voice/music separation. Older saved attack and recovery values are ignored after upgrade."
QuietAttenuation="Quiet-period attenuation"
QuietAttenuationHelp="The quiet endpoint of the same fader, reached after about 1.2 seconds without activity. For example, 3 dB sets the long-quiet gain target to −3 dB; speech returns smoothly toward its rolling target. Set 0 dB for unity. Range: 0 to 12 dB. This cannot remove background noise while music or speech is active."
