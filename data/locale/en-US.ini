InfoTooltip="How automatic level balancing works"
InfoTitle="About automatic level balancing"
InfoText="This filter automatically rides one mixed audio feed toward the selected rolling loudness target. The IN fast RMS rail uses dBFS and marks the configured absolute activity floor. The OUT area has separate fast dBFS and 400 ms K-weighted LUFS rails, so its rolling target is never drawn on a dBFS scale. Numeric readings also retain 400 ms IN and 3 s IN/OUT estimates; these are rolling estimates, not integrated-program LUFS normalization.\n\nThe gain bar uses a fixed −36 to +36 dB scale centered at 0 dB. The current applied gain fills from the center; marker lines and end labels show maximum reduction and boost. The FADER label shows this source's response setting; hover the gain bar for the setting and quiet endpoint. This is the single non-peak gain control: 0 is fast and 100 is smooth. At the default 85, it blends 85% of the 3 s loudness reading with the 400 ms reading and limits dB-domain movement to about 3.8 dB/s down and 4.5 dB/s up at most. From slew alone, a 12 dB move takes at least about 3.1 s down or 2.7 s up; detector smoothing can make it longer. Between words, it holds the actual fader position for about 1.2 seconds, so a brief phrase will not keep raising room noise while the fader is still moving. After a longer quiet pause, the same fader moves toward the quiet-period attenuation endpoint (for example, −3 dB); when activity resumes, it smoothly moves toward the rolling target.\n\nThis is a single-feed level rider, not a voice separator or denoiser. Music, speech, and background noise that are present together share the same gain, so the filter cannot raise only the voice or remove noise during active music/speech. A recent input-peak envelope lets the main fader take over sustained peak-ceiling work; the separate fast 4x FIR guard still catches sudden peaks. The peak reading is an estimate, not a certified BS.1770 conformance result.\n\nThe filter adds six samples from input to output: 0.125 ms at 48 kHz or about 0.136 ms at 44.1 kHz. This excludes audio-interface delay, other OBS buffering or processing, encoding, streaming, and viewer playback. The activity floor is one part of a relative gate; crossing its absolute level alone does not guarantee gain will open."
