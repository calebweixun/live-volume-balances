RollingReadingsHelp="K-weighted rolling loudness estimates at this filter's input/output: 400 ms momentary and 3 s short-term. They are not integrated-program LUFS. Readings are before the OBS source volume fader."
FastMeterHelp="Fast channel-linked RMS level at this filter's input/output, before the OBS source volume fader. dBFS scale −60 to 0, with 30 ms attack and 150 ms decay."
InputActivityMarkerHelp="Input fast RMS uses a −100 to 0 dBFS scale. The marker shows the configured absolute activity floor; the relative activity gate can also keep gain closed."
InputActivityFloorReadoutFormat="FLOOR %1"
TargetLufsRailHelp="This filter's 400 ms K-weighted output loudness uses a separate −60 to 0 LUFS scale. The marker shows the rolling target; it is not a peak limit. The OBS source volume fader is downstream and is not included."
TargetLufsReadoutFormat="TARGET %1"
TargetLufsLimitedReadoutFormat="TARGET %1 · LIMITED"
TargetLufsPeakLimitedReadoutFormat="TARGET %1 · PEAK"
TargetLufsBoostLimitedReadoutFormat="TARGET %1 · BOOST"
TargetLufsPeakLimitedHelp="The peak-aware rider or 4x FIR peak guard is holding gain at its available ceiling while rolling output remains below target. Higher average loudness would exceed the configured peak ceiling. The OBS source volume fader is downstream and is not included in this meter."
TargetLufsBoostLimitedHelp="The main fader is near its Maximum Compensation cap while rolling output remains below target. Raising Maximum Compensation can also raise room noise during active audio. The OBS source volume fader is downstream and is not included in this meter."
TargetLufsBothLimitedHelp="Both the peak ceiling and Maximum Compensation constrain gain while rolling output remains below target. The OBS source volume fader is downstream and is not included in this meter."
GainBarHelp="Signed net gain applied by this filter on a fixed −36 to +36 dB scale; the center is 0 dB. It includes the fast peak guard, but not the downstream OBS source volume fader. Marker lines and labels show the configured maximum reduction and boost."
GainAdvancedSettingsTooltipFormat="Fader smoothness: %1/100 · Re-entry speed: %2/100 · Quiet endpoint: −%3 dB"
FaderSmoothnessTagTooltip="The fader response setting for this source: 0 is fast and 100 is smooth."
ActivityReentrySpeed="Activity Re-entry Speed"
ActivityReentrySpeedHelp="After the activity gate has opened and then fully closed, a new signal must stay above its opening threshold for about 40 ms. Then this temporarily favors the 400 ms reading and speeds the upward fader for up to 2 seconds while the gate remains open, including its hold period. It does not accelerate initial startup, bypass the activity gate, maximum boost, or peak ceiling, and does not identify speech versus music."
PeakMeterHelp="4x FIR estimated intersample peak hold and the configured output guard ceiling. This estimate has not been certified against the full BS.1770 conformance suite."
MeterRangeHelp="Meter scales are shown in each rail's tooltip. Tick marks divide the selected dB scale into quarters."
OpenFilterSettings="Open this filter's settings"
MonitorLatencyFormat="FILTER DELAY · IN 0.000 ms · OUT +%1 ms · %2 samples"
MonitorLatencyUnavailable="FILTER DELAY · IN — · OUT —"
MonitorLatencyHelp="Delay from this filter's input to its output only. The filter adds six samples. It excludes the downstream OBS source volume fader, audio-interface delay, other OBS buffering or processing, encoding, streaming, and viewer playback."
FilterStageInfo="The IN/OUT meters and NET GAIN are measured at this filter's input and output. OBS applies the source's mixer volume fader downstream, so that fader can change the level heard or streamed without changing this filter's meters."
InfoTooltip="How automatic level balancing works"
InfoTitle="About automatic level balancing"
InfoText="This filter automatically rides one mixed audio feed toward the selected rolling loudness target. The IN fast RMS rail uses dBFS and marks the configured absolute activity floor. The OUT area has separate fast dBFS and 400 ms K-weighted LUFS rails, so its rolling target is never drawn on a dBFS scale. Numeric readings also retain 400 ms IN and 3 s IN/OUT estimates; these are rolling estimates, not integrated-program LUFS normalization.\n\nThe gain bar uses a fixed −36 to +36 dB scale centered at 0 dB. The current applied gain fills from the center; marker lines and end labels show maximum reduction and boost. The FADER label shows this source's smoothness setting; hover the gain bar for smoothness, activity re-entry speed, and the quiet endpoint. Smoothness 0 is fast and 100 is smooth. At the default 85, it blends 85% of the 3 s loudness reading with the 400 ms reading and limits dB-domain movement to about 3.8 dB/s down and 4.5 dB/s up at most. From slew alone, a 12 dB move takes at least about 3.1 s down or 2.7 s up; detector smoothing can make it longer. The separate Activity Re-entry Speed applies only after the gate has opened and fully closed, and a new signal stays above its opening threshold for about 40 ms. It temporarily favors the 400 ms reading and speeds upward recovery for up to 2 seconds. This does not accelerate startup, change ordinary fader movement, or bypass the activity gate, compensation cap or peak ceiling. Between words, the fader holds its actual position for about 1.2 seconds. After a longer quiet pause, it moves toward the quiet endpoint (for example, −3 dB); when activity resumes, it moves toward the rolling target.\n\nA BOOST tag means the main fader is near the Maximum Compensation cap while the rolling output remains below target. A PEAK tag means the peak-aware rider or fast guard is holding gain at the available peak ceiling. Both limits can keep output below target; the target is not guaranteed when either applies. For example, −33.9 LUFS input with a +12 dB boost cap can reach only about −21.9 LUFS before peak-headroom effects, not −14 LUFS.\n\nThis is a single-feed level rider, not a voice separator or denoiser. Music, speech, and background noise that are present together share the same gain, so the filter cannot raise only the voice or remove noise during active music/speech. A recent input-peak envelope lets the main fader take over sustained peak-ceiling work; the separate fast 4x FIR guard still catches sudden peaks. The peak reading is an estimate, not a certified BS.1770 conformance result.\n\nThe filter adds six samples from input to output: 0.125 ms at 48 kHz or about 0.136 ms at 44.1 kHz. This excludes audio-interface delay, other OBS buffering or processing, encoding, streaming, and viewer playback. The activity floor is one part of a relative gate; crossing its absolute level alone does not guarantee gain will open."
