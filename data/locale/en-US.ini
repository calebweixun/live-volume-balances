InfoTooltip="How automatic level balancing works"
InfoTitle="About automatic level balancing"
InfoText="This filter automatically rides one mixed audio feed toward the selected rolling loudness target. It uses a K-weighted 400 ms detector with a 3 s rolling meter, so readings are estimates rather than integrated-program LUFS normalization.\n\nThe target controls average loudness. The 4x FIR peak guard ceiling is a separate output-safety limit and can reduce gain when transients approach the ceiling. It adds a fixed 6-sample delay (about 0.13 ms at 48 kHz). The activity floor uses per-channel RMS plus a relative gate to avoid lifting room noise in pauses; tune the floor if quiet speech is not opening the gate or room ambience is being raised.\n\nGain changes are smoothed to retain musical dynamics. Strongly different source levels may not reach the same target when maximum compensation or the peak ceiling is reached. The peak estimate has not been certified against the full BS.1770 conformance suite."
