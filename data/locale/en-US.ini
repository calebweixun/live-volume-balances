InfoTooltip="How automatic level balancing works"
InfoTitle="About automatic level balancing"
InfoText="This filter automatically rides one mixed audio feed toward the selected rolling loudness target. The fast IN/OUT bars show channel-linked RMS with 30 ms attack and 150 ms decay. The numeric readings use separate K-weighted 400 ms and 3 s rolling windows; these are estimates, not integrated-program LUFS normalization.\n\nThe target controls average loudness. The 4x FIR peak guard ceiling is a separate output-safety limit and can reduce gain when transients approach the ceiling. The filter adds six samples from its input to its output: 0.125 ms at 48 kHz or about 0.136 ms at 44.1 kHz. This excludes audio-interface delay, other OBS buffering or processing, encoding, streaming, and viewer playback.\n\nThe activity floor uses channel-linked RMS plus a relative gate to avoid lifting room noise in pauses. Gain changes are smoothed to retain musical dynamics. Strongly different source levels may not reach the same target when maximum compensation or the peak ceiling is reached. The peak estimate has not been certified against the full BS.1770 conformance suite."
