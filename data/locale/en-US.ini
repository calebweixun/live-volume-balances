LiveVolumeBalancer="Live Volume Balancer"
TargetLoudness="Target rolling loudness"
TargetLoudnessHelp="Rides average loudness toward this 400 ms rolling estimate; the dock also shows a 3 s reading. Range: −36 to 0 LUFS. This is a goal, not an output ceiling; maximum upward compensation or the peak guard ceiling can keep the output below the target."
PeakCeiling="4x FIR peak guard ceiling"
PeakCeilingHelp="Separate output safety limit for estimated intersample peaks. Range: −24 to 0 dBTP est."
Bypass="Bypass"
BypassHelp="Disables gain riding and peak protection while keeping the fixed output delay."
Advanced="Advanced settings"
MaximumCompensation="Maximum upward compensation"
MaximumCompensationHelp="Caps how much active quiet audio can be raised. Range: 0 to 36 dB."
MaximumReduction="Maximum downward reduction"
MaximumReductionHelp="Caps gain reduction when the input is louder than the target. Range: 0 to 36 dB."
ActivityFloor="Activity floor (room-noise gate)"
ActivityFloorHelp="Uses channel-linked RMS. Raise this if pauses lift room noise; lower it if quiet speech does not open the gate. Range: −100 to −6 dBFS."
GainAttack="Reduction attack"
GainAttackHelp="How quickly gain is reduced when input level rises. Range: 10 to 3000 ms."
GainRecovery="Gain recovery"
GainRecoveryHelp="How quickly gain returns as the input level falls. Range: 50 to 10000 ms."
FaderSmoothness="Fader transition smoothness"
FaderSmoothnessHelp="Shapes the gain rider from 0 (400 ms detector and existing attack/recovery only) to 100 (stronger hold across short level changes). At 85, large changes are limited to about 11 dB/s down and 5.3 dB/s up, with eased acceleration. From the slew-rate limits alone, a 12 dB move takes at least about 1.1 s down / 2.4 s up; detector windows, about 433 ms of gain-target persistence, and attack/recovery settings can make actual transitions longer. It continuously blends about 76.5% of the 3 s reading with the 400 ms reading, so brief phrases move the main fader less. If active audio stays more than 8 LU below the 3 s reading for 0.8 s, the rider temporarily favors the 400 ms reading and recovers upward faster; the activity gate must remain open, so a closed pause cannot trigger this assist. A sustained new level still rides over several seconds. Downward gain moves faster than recovery. This responds to the mixed program level, not voice/music separation."
QuietAttenuation="Quiet-period attenuation"
QuietAttenuationHelp="After the activity gate closes, smoothly fades the mixed output down by this amount; it fades back when activity resumes. Set 0 dB to turn it off. Range: 0 to 12 dB. It cannot remove background noise while music or speech keeps the gate open."
