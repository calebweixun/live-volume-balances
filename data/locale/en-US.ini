InfoTooltip="How automatic level balancing works"
InfoTitle="About automatic level balancing"
InfoText="This filter automatically rides one mixed audio feed toward the selected rolling loudness target. The IN fast RMS rail uses dBFS and marks the configured absolute activity floor. The OUT area has separate fast dBFS and 400 ms K-weighted LUFS rails, so its rolling target is never drawn on a dBFS scale. Numeric readings also retain 400 ms IN and 3 s IN/OUT estimates; these are rolling estimates, not integrated-program LUFS normalization.\n\nThe gain bar uses a fixed −36 to +36 dB scale centered at 0 dB. The current applied gain fills from the center; marker lines and end labels show maximum reduction and boost. Hover the gain bar to see the current fader smoothness and quiet-period attenuation values. The large value gives the signed gain. ↓ attack and ↑ recovery show the active smoothing settings. At the default fader smoothness of 85, the rider continuously blends about 76.5% of the 3 s loudness reading with the 400 ms reading, adds about 433 ms of target persistence, and limits dB-domain movement. If active audio stays more than 8 LU below the 3 s reading for 0.8 s, it temporarily favors the 400 ms reading and recovers upward faster; the activity gate must remain open. This reduces short-phrase pumping while allowing sustained changes to rise or fall over several seconds; downward gain moves faster than recovery. Quiet-period attenuation fades the whole mixed output down only after the activity gate closes, then fades back when activity resumes.\n\nThis is a single-feed level rider, not a voice separator or denoiser. Music, speech, and background noise that are present together share the same gain, so the filter cannot raise only the voice or remove noise during active music/speech. The 4x FIR peak guard can further lower gain to protect the separate peak ceiling.\n\nThe filter adds six samples from input to output: 0.125 ms at 48 kHz or about 0.136 ms at 44.1 kHz. This excludes audio-interface delay, other OBS buffering or processing, encoding, streaming, and viewer playback. The activity floor is one part of a relative gate; crossing its absolute level alone does not guarantee gain will open. The peak estimate has not been certified against the full BS.1770 conformance suite."
