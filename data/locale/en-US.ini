InfoTooltip="How automatic level balancing works"
InfoTitle="About automatic level balancing"
InfoText="This filter automatically rides one mixed audio feed toward the selected rolling loudness target. The IN fast RMS rail uses dBFS and marks the configured absolute activity floor. The OUT area has separate fast dBFS and 400 ms K-weighted LUFS rails, so its rolling target is never drawn on a dBFS scale. Numeric readings also retain 400 ms IN and 3 s IN/OUT estimates; these are rolling estimates, not integrated-program LUFS normalization.\n\nThe gain bar uses a fixed −36 to +36 dB scale centered at 0 dB. The current applied gain fills from the center; marker lines and end labels show maximum reduction and boost. The large value gives the signed gain. ↓ attack and ↑ recovery show the active smoothing settings. The 4x FIR peak guard can further lower gain to protect the separate peak ceiling.\n\nThe filter adds six samples from input to output: 0.125 ms at 48 kHz or about 0.136 ms at 44.1 kHz. This excludes audio-interface delay, other OBS buffering or processing, encoding, streaming, and viewer playback. The activity floor is one part of a relative gate; crossing its absolute level alone does not guarantee gain will open. The peak estimate has not been certified against the full BS.1770 conformance suite."
